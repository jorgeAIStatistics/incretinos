name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository.
permissions:
  contents: read

# A newer push to the same branch or pull request replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # CI is configured by the variables in this file only; no .env file is read.
  INCRETINOS_ENV_FILE: none

jobs:
  backend:
    name: Backend (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/constraints.txt
            backend/pyproject.toml
      - name: Install with the pinned versions
        run: pip install -c constraints.txt -e ".[dev]"
      - run: ruff check incretinos tests scripts
      - name: Unit and integration tests (offline fixtures, no network)
        run: pytest -q --cov=incretinos --cov-report=term-missing:skip-covered
      - name: Migrations build the schema, and the models have not drifted from them
        env:
          INCRETINOS_DATABASE_URL: sqlite:///./var/ci-migrate.db
        run: |
          alembic upgrade head
          alembic check
      - name: Scientific validation rules on a freshly seeded database
        run: |
          incretinos seed --reset
          incretinos validate
      - name: Claim-verification benchmarks (reported; a set that cannot be run fails the step)
        run: |
          incretinos benchmark-claims --set dev
          incretinos benchmark-claims --set dev-review
          incretinos benchmark-claims --set heldout

  backend-postgres:
    name: Backend (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine  # the version docker-compose.yml runs
        env:
          POSTGRES_USER: incretinos
          POSTGRES_PASSWORD: incretinos-ci
          POSTGRES_DB: incretinos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U incretinos -d incretinos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      INCRETINOS_DATABASE_URL: postgresql+psycopg://incretinos:incretinos-ci@localhost:5432/incretinos
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/constraints.txt
            backend/pyproject.toml
      - name: Install with the pinned versions
        run: pip install -c constraints.txt -e ".[dev]"
      - name: Migrate (the path the container takes), then check for drift between models and migrations
        run: |
          incretinos init-db
          alembic check
      - name: Seed from the committed fixtures
        run: incretinos seed
      - name: Scientific validation rules
        run: incretinos validate
      - name: Backend tests against PostgreSQL
        # The suite drops and rebuilds the database named here, then seeds it itself. Tests that need a
        # scratch database create their own SQLite file, so the whole suite runs.
        env:
          INCRETINOS_TEST_DATABASE_URL: postgresql+psycopg://incretinos:incretinos-ci@localhost:5432/incretinos
        run: pytest -q

  images:
    name: Container images build and start
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: The Compose file is valid
        run: docker compose config --quiet
      - name: Build the API and web images (the API image installs from backend/constraints.txt)
        run: docker compose build
      - name: Start the stack (migrate, seed from the fixtures, serve) and wait until every service is up
        run: docker compose up -d --wait --wait-timeout 420
      - name: Smoke test through the published ports
        run: |
          set -eu
          # The API through the web server's baked /api rewrite, and directly on its loopback port.
          curl -fsS --retry 20 --retry-delay 3 --retry-all-errors http://127.0.0.1:3000/api/health
          curl -fsS http://127.0.0.1:8000/api/health
          # A page from the standalone server, with the production Content-Security-Policy (no eval, no websocket).
          curl -fsS -o /dev/null -D web-headers.txt http://127.0.0.1:3000/
          grep -qi "^content-security-policy: default-src 'self'" web-headers.txt
          if grep -qiE "unsafe-eval|ws: wss:" web-headers.txt; then echo "development CSP served by the production image"; exit 1; fi
          # The image ships no environment file from the build context.
          test -z "$(docker compose exec -T web sh -c 'ls -a /app | grep "^\.env" || true')"
          # An oversized body is refused before it is parsed, also through the proxy.
          status=$(head -c 70000 /dev/zero | tr '\0' ' ' | curl -s -o /dev/null -w '%{http_code}' -H 'content-type: application/json' --data-binary @- http://127.0.0.1:3000/api/compare)
          test "$status" = 413
      - name: Service logs
        if: always()
        run: docker compose logs --no-color --tail 200
      - name: Stop the stack and remove its volume
        if: always()
        run: docker compose down -v

  frontend:
    name: Frontend and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/constraints.txt
            backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend environment for the browser tests
        # The Playwright configuration starts its own API from backend/.venv on its own port and seeds its own
        # database (backend/var/e2e.db), so the package has to be installed there; nothing is seeded here.
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -c constraints.txt -e .
          mkdir -p var  # the test server writes its seed log and database here
      - working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Type-check (application and browser tests), lint, build
        working-directory: frontend
        run: npm run typecheck && npm run lint && npm run build
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser tests (workflows, design foundation, scientific presentation, review fixes, evidence review workbench; each fails on any browser-console error)
        working-directory: frontend
        # Named explicitly so that a removed or renamed spec file fails the step instead of silently running fewer tests.
        run: npx playwright test e2e/workflows.spec.ts e2e/foundation.spec.ts e2e/presentation.spec.ts e2e/review-fixes.spec.ts e2e/review.spec.ts e2e/conflicts.spec.ts
      - name: The same browser tests against the production build (standalone server, production Content-Security-Policy)
        working-directory: frontend
        env:
          E2E_WEB: production
        run: npx playwright test e2e/workflows.spec.ts e2e/foundation.spec.ts e2e/presentation.spec.ts e2e/review-fixes.spec.ts e2e/review.spec.ts e2e/conflicts.spec.ts
      - name: Keep the traces and the seed log when a browser test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-output
          path: |
            frontend/test-results/
            backend/var/e2e-seed.log
          if-no-files-found: ignore
          retention-days: 7
