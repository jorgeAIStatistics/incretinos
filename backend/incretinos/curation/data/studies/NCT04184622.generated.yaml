claims:
- key: note:retatrutide-tirzepatide:F142
  topic: Q5_TIRZEPATIDE_SURMOUNT_1
  statement: 'SURMOUNT-1: phase 3 double-blind RCT, 2539 adults with BMI >=30 or >=27 plus a weight-related complication (no diabetes), 1:1:1:1 to tirzepatide 5/10/15 mg or placebo for 72 weeks; N Engl
    J Med 2022;387:205-216; PMID 35658024; DOI 10.1056/NEJMoa2206038. Coprimary end points: % weight change and >=5% weight reduction.'
  source: pubmed:35658024
  quote: Coprimary end points were the percentage change in weight from baseline and a weight reduction of 5% or more.
- key: note:retatrutide-tirzepatide:F143
  topic: Q5_TIRZEPATIDE_SURMOUNT_1
  statement: NEJM abstract defines the reported estimand as the treatment-regimen estimand in the ITT population.
  source: pubmed:35658024
  quote: The treatment-regimen estimand assessed effects regardless of treatment discontinuation in the intention-to-treat population.
- key: note:retatrutide-tirzepatide:F162
  topic: Q5_TIRZEPATIDE_SURMOUNT_1
  statement: 'Zepbound label, pooled Studies 1 and 2: 4.8%, 6.3% and 6.7% (5/10/15 mg) permanently discontinued treatment due to adverse reactions vs 3.4% with placebo.'
  source: openfda-label:zepbound
  quote: Across both trials, 4.8%, 6.3%, and 6.7% of patients treated with 5 mg, 10 mg, and 15 mg of ZEPBOUND, respectively, permanently discontinued treatment
- key: note:retatrutide-tirzepatide:F163
  topic: Q5_TIRZEPATIDE_SURMOUNT_1
  statement: 'Body composition substudy: 160 of 2539 SURMOUNT-1 participants (pooled tirzepatide n=124, placebo n=36) had whole-body dual-energy X-ray absorptiometry (DXA) at baseline and week 72. Source:
    Look et al., Diabetes Obes Metab 2025;27(5):2720-2729, PMID 39996356 (erratum PMID 40832789).'
  source: pubmed:39996356
  quote: Substudy participants (n = 160 of the 2539 in SURMOUNT-1) underwent dual-energy X-ray absorptiometry (DXA) at baseline and Week 72.
- key: note:retatrutide-tirzepatide:F164
  topic: Q5_TIRZEPATIDE_SURMOUNT_1
  statement: 'What was measured: DXA "lean mass" = fat-free mass minus total bone mineral content (lean soft tissue mass). This is not a direct measure of skeletal muscle.'
  source: pubmed:39996356
  quote: Fat-free mass minus total bone mineral content (also known as lean soft tissue mass)
- key: note:retatrutide-tirzepatide:F167
  topic: Q5_TIRZEPATIDE_SURMOUNT_1
  statement: In the DXA substudy, body weight, fat mass and lean mass changed by -21.3%, -33.9% and -10.9% with tirzepatide and -5.3%, -8.2% and -2.6% with placebo (baseline to week 72).
  source: pubmed:39996356
  quote: from baseline to Week 72 was -21.3%, -33.9% and -10.9% with tirzepatide and -5.3%, -8.2% and -2.6% with placebo
- key: note:retatrutide-tirzepatide:F168
  topic: Q5_TIRZEPATIDE_SURMOUNT_1
  statement: 'Post hoc: of body weight lost with tirzepatide, 74% was DXA fat mass and 26% DXA lean mass (placebo 75%/25%).'
  source: pubmed:39996356
  quote: The proportion of body weight reduction was 74% as fat mass and 26% as lean mass with tirzepatide
- key: note:retatrutide-tirzepatide:F169
  topic: Q5_TIRZEPATIDE_SURMOUNT_1
  statement: 'Lilly 2022 release wording for the same DXA result: approximately three times greater percent reduction in fat mass than lean mass (33.9% vs 10.9%).'
  source: web:eli-lilly-an-2022-06-04-lilly-s-surmount-1-results-published-in
  quote: 33.9% fat mass reduction compared to a 10.9% lean mass reduction
