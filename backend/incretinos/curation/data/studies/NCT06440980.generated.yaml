adverse_events: []
claims:
- key: note:orforglipron:F49
  topic: Q2_FORMULATION_HARMONIZATION_CAPSULE_VS
  statement: FDA review identifies the bridging study as J2A-MC-GZPI (NCT06440980), an open-label, randomized, dose-escalation, multiple-dose bioequivalence study in adults with overweight or obesity who
    are otherwise healthy.
  source: web:u-s-fda-ce-2026-05-15-nda-220934-foundayo-orforglipron-nda-mul
  quote: Study GZPI provided the bioequivalence assessments for the tablet and capsule dosage forms
- key: note:orforglipron:F50
  topic: Q2_FORMULATION_HARMONIZATION_CAPSULE_VS
  statement: 'Peer-reviewed bioequivalence study: participants received capsule doses of 1, 3, 6, 12, 24 or 36 mg and corresponding tablet doses of 0.8, 2.5, 5.5, 9, 14.5 and 17.2 mg once daily for 7 days
    each, fasted; bioequivalence was demonstrated across all six doses.'
  source: pubmed:41994902
  quote: capsule doses of 1, 3, 6, 12, 24, or 36 mg and corresponding tablet doses of 0.8, 2.5, 5.5, 9, 14.5, and 17.2 mg
- key: note:orforglipron:F52
  topic: Q2_FORMULATION_HARMONIZATION_CAPSULE_VS
  statement: 'The publication explains why strengths differ: tablet dose strengths are numerically lower than capsule strengths, particularly at higher doses, because of a difference in drug absorption
    between the two products; bioequivalence was therefore assessed on a dose-adjusted basis, with tablet strengths selected from a pilot relative-bioavailability study.'
  source: pubmed:41994902
  quote: the tablet dose strengths are numerically lower than the capsule dose strengths, particularly at higher doses
- key: note:orforglipron:F53
  topic: Q2_FORMULATION_HARMONIZATION_CAPSULE_VS
  statement: The publication's primary endpoints were AUC0-24,ss and Cmax,ss at capsule doses of 3, 6, 12 and 36 mg; the 1 mg and 24 mg comparisons were secondary endpoints.
  source: pubmed:41994902
  quote: bioequivalence between orforglipron tablets and capsules at capsule doses of 3, 6, 12, and 36 mg
- key: note:orforglipron:F54
  topic: Q2_FORMULATION_HARMONIZATION_CAPSULE_VS
  statement: The authors state that all previously generated phase 3 data were for the capsule presentation and that, given bioequivalence, capsule-dose safety and efficacy are expected to be equivalent
    for the corresponding tablet doses (an expectation, not a tablet efficacy result).
  source: pubmed:41994902
  quote: All previously generated phase 3 clinical data for orforglipron
