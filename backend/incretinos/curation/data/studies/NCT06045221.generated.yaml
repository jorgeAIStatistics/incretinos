claims:
- key: note:orforglipron:F368
  topic: Q5_ACHIEVE_3_PUBLICATION
  statement: 'ACHIEVE-3 is published: Rosenstock J, et al. Lancet 2026;407(10534):1147-1160; PMID 41765029; DOI 10.1016/S0140-6736(26)00202-3; published online 2026-02-26. ClinicalTrials.gov NCT06045221
    has posted results (first posted 2026-09-15).'
  source: pubmed:41765029
  quote: This trial was registered on ClinicalTrials.gov (NCT06045221) and is completed.
- key: note:orforglipron:F369
  topic: Q5_ACHIEVE_3_DESIGN
  statement: ACHIEVE-3 was a 52-week, randomised, open-label, active-controlled, multicentre, multinational phase 3 trial in adults with type 2 diabetes inadequately controlled on metformin (>=1500 mg/day),
    HbA1c 7.0-10.5%, BMI >=25, at 131 centres in Argentina, China, Japan, Mexico and the USA.
  source: pubmed:41765029
  quote: 52-week, randomised, open-label, active-controlled, multicentre, multinational, phase 3 study
- key: note:orforglipron:F372
  topic: Q5_ACHIEVE_3_DESIGN
  statement: 'ACHIEVE-3: hierarchical analysis for superiority was prespecified after attainment of non-inferiority; the abstract reports that non-inferiority was met and both orforglipron doses showed
    superiority to both semaglutide doses.'
  source: pubmed:41765029
  quote: Hierarchical analysis for superiority was prespecified after attainment of non-inferiority.
- key: note:orforglipron:F417
  topic: Q5_ACHIEVE_3_SAFETY
  statement: 'ACHIEVE-3: mean pulse-rate increase was greater with orforglipron (12 mg 3.7 bpm; 36 mg 4.7 bpm) than with oral semaglutide (7 mg 1.0 bpm; 14 mg 1.5 bpm); four deaths occurred (one on each
    orforglipron dose, two on semaglutide 7 mg).'
  source: pubmed:41765029
  quote: (12 mg 3·7 bpm; 36 mg 4·7 bpm) than in the semaglutide groups (7 mg 1·0 bpm; 14 mg 1·5 bpm)
- key: note:orforglipron:F418
  topic: Q5_ACHIEVE_3_SAFETY
  statement: Lilly's ACHIEVE-3 topline release cautions that the study was not powered to compare the safety and tolerability of orforglipron and oral semaglutide.
  source: web:eli-lilly-an-2025-09-17-lilly-s-oral-glp-1-orforglipron-superior
  quote: the study was not powered to compare the safety and tolerability of orforglipron and oral semaglutide
