claims:
- key: note:orforglipron:F200
  topic: Q4_ATTAIN_2_PUBLICATION
  statement: 'ATTAIN-2 primary publication: Horn DB, et al. Lancet, volume 406, issue 10522, pages 2927-2944; PMID 41275875; DOI 10.1016/S0140-6736(25)02165-8; published online 2025-11-20.'
  source: pubmed:41275875
  quote: This trial was registered at ClinicalTrials.gov (NCT05872620) and is completed.
- key: note:orforglipron:F202
  topic: Q4_ATTAIN_2_DESIGN
  statement: 'ATTAIN-2 primary endpoint: mean percent change in bodyweight from baseline to week 72; the treatment regimen estimand (all randomized participants regardless of intercurrent events) was the
    primary estimand and the efficacy estimand supportive.'
  source: pubmed:41275875
  quote: was the primary estimand, with the efficacy estimand considered supportive
- key: note:orforglipron:F204
  topic: Q4_ATTAIN_2_WEIGHT_CHANGE
  statement: 'FDA statistical reviewer comment on ATTAIN-2: because the difference from placebo was below 5% for orforglipron 6 mg and 12 mg, the reviewer called it questionable whether those results are
    clinically meaningful to support the indication in this (type 2 diabetes) trial population.'
  source: web:u-s-fda-ce-2026-05-15-nda-220934-foundayo-orforglipron-nda-mul
  quote: it is questionable whether the results are clinically meaningful to support the indication in this trial population
- key: note:orforglipron:F281
  topic: Q4_ATTAIN_2_SAFETY
  statement: 'ATTAIN-2 Lancet abstract: treatment discontinuations due to adverse events (mainly gastrointestinal) were 6.1-9.9% across orforglipron arms versus 4.1% with placebo.'
  source: pubmed:41275875
  quote: were higher for orforglipron (6·1-9·9%) versus placebo (4·1%)
