claims:
- key: note:retatrutide-tirzepatide:F34
  topic: Q3_RETATRUTIDE_PHASE_3_TRIUMPH_TRANSCEND
  statement: 'Press release: 80-week trial; 2,339 participants randomized 1:1:1:1 to retatrutide 4 mg, 9 mg, 12 mg or placebo; dose escalation every 4 weeks from 2 mg; pre-specified extension to 104 weeks
    in 532 participants with baseline BMI >=35.'
  source: web:eli-lilly-an-2026-05-21-lilly-s-triple-agonist-retatrutide-deliv
  quote: The study randomized 2,339 participants in a 1:1:1:1 ratio to receive either retatrutide 4 mg, 9 mg, 12 mg, or placebo.
- key: note:retatrutide-tirzepatide:F35
  topic: Q3_RETATRUTIDE_PHASE_3_TRIUMPH_TRANSCEND
  statement: 'Peer-reviewed publication of TRIUMPH-1: N Engl J Med, published online 2026-09-29, PMID 42814954, DOI 10.1056/NEJMoa2604169; 2339 randomized; weight end points analysed with a treatment-regimen
    estimand (ITT).'
  source: pubmed:42814954
  quote: For weight-related end points, intercurrent events were handled by a treatment-regimen estimand (intention-to-treat [ITT]).
- key: note:retatrutide-tirzepatide:F63
  topic: Q3_RETATRUTIDE_PHASE_3_TRIUMPH_TRANSCEND
  statement: 'TRIUMPH-1 analyses flagged by the source as not multiplicity-controlled / post hoc: proportion achieving BMI <30 (pre-specified, not controlled for multiplicity); same endpoint in baseline
    BMI >=40 subgroup (post hoc).'
  source: web:eli-lilly-an-2026-05-21-lilly-s-triple-agonist-retatrutide-deliv
  quote: The proportion of participants achieving BMI <30 was a pre-specified analysis not controlled for multiplicity
- key: note:retatrutide-tirzepatide:F64
  topic: Q3_RETATRUTIDE_PHASE_3_TRIUMPH_TRANSCEND
  statement: 'TRIUMPH-1 knee OA basket (NEJM, n=574): change in WOMAC pain score, hybrid estimand: -3.2 (4 mg), -3.5 (9 mg), -3.6 (12 mg) vs -1.9 placebo; differences -1.6 and -1.8 points, both P<0.001.'
  source: pubmed:42814954
  quote: the corresponding changes in the pain score in the retatrutide groups for the hybrid estimand were -3.2, -3.5, and -3.6 versus -1.9 with placebo
- key: note:retatrutide-tirzepatide:F65
  topic: Q3_RETATRUTIDE_PHASE_3_TRIUMPH_TRANSCEND
  statement: 'TRIUMPH-1 OSA basket (NEJM, n=243): change in apnea-hypopnea index (events/h), hybrid-treatment estimand: -22.9 (4 mg), -34.3 (9 mg), "31.7" (12 mg, printed without minus sign) vs -9.9 placebo;
