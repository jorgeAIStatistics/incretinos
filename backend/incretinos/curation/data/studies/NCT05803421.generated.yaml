- key: note:orforglipron:F56
  topic: Q2_FORMULATION_HARMONIZATION_CAPSULE_VS
  statement: 'Lilly ACHIEVE-4 topline release (2026-04-16): participants started with 1 mg capsule (corresponds to 0.8 mg tablets) and escalated to a maximum tolerated dose of up to 36 mg capsule/17.2 mg
    tablet.'
  source: web:eli-lilly-an-2026-04-16-achieve-4-the-longest-phase-3-study-of-l
  quote: 1 mg capsule (corresponds to 0.8 mg tablets)
- key: note:orforglipron:F58
  topic: Q2_FORMULATION_HARMONIZATION_CAPSULE_VS
  statement: The ACHIEVE-4 Lancet abstract states the orforglipron maximum tolerated dose as up to 36 mg capsule, equivalent to 17.2 mg tablet.
  source: pubmed:42815506
  quote: up to 36 mg capsule [equivalent to 17·2 mg tablet]
- key: note:orforglipron:F419
  topic: Q6_ACHIEVE_4_PUBLICATION_STATUS
  statement: 'ACHIEVE-4 is published in a peer-reviewed journal: Klein KR, et al. Lancet, online ahead of print 2026-09-30 (no volume/issue yet); PMID 42815506; DOI 10.1016/S0140-6736(26)01865-9. It was
    presented at EASD 2026 the same day; topline results had been issued by press release on 2026-04-16.'
  source: pubmed:42815506
  quote: This trial was registered on ClinicalTrials.gov (NCT05803421) and is completed.
- key: note:orforglipron:F421
  topic: Q6_ACHIEVE_4_DESIGN
  statement: ACHIEVE-4 was an event-driven, phase 3, multicentre, randomised, open-label, active-comparator, parallel-group study at 317 sites in 16 countries and territories.
  source: pubmed:42815506
  quote: event-driven, phase 3, multicentre, randomised, open-label, active comparator, parallel-group study was conducted in 317 sites across 16 countries and territories
- key: note:orforglipron:F422
  topic: Q6_ACHIEVE_4_DESIGN
  statement: 'ACHIEVE-4 population: adults with type 2 diabetes at increased cardiovascular risk, HbA1c 7.0-10.5%, BMI >=25, on up to three glucose-lowering medications (metformin, a sulfonylurea and/or
    an SGLT2 inhibitor); all had established cardiovascular or chronic kidney disease.'
  source: pubmed:42815506
  quote: All participants had established cardiovascular or chronic kidney disease.
- key: note:orforglipron:F424
  topic: Q6_ACHIEVE_4_CARDIOVASCULAR_ANALYSIS
  statement: 'ACHIEVE-4 primary outcome: time to occurrence of four-component MACE (MACE-4) = cardiovascular death, non-fatal myocardial infarction, non-fatal stroke, or hospitalisation for unstable angina.'
  source: pubmed:42815506
  quote: time to occurrence of four-component major adverse cardiovascular events (MACE-4), including cardiovascular death, non-fatal myocardial infarction, non-fatal stroke, or hospitalisation for unstable
    angina
- key: note:orforglipron:F426
  topic: Q6_ACHIEVE_4_CARDIOVASCULAR_ANALYSIS
  statement: 'ACHIEVE-4 analysis set for the primary and safety endpoints: all participants who took at least one dose of assigned treatment, using all data from baseline until withdrawal or study completion
    regardless of treatment adherence.'
  source: pubmed:42815506
  quote: assessed in all participants who took at least one dose of assigned treatment
- key: note:orforglipron:F437
  topic: Q6_ACHIEVE_4_CARDIOVASCULAR_ANALYSIS
  statement: 'Lilly''s release lists the ACHIEVE-4 results NOT controlled for family-wise type 1 error: all-cause death, cardiovascular death, waist circumference, serum lipids, blood pressure, hsCRP and
    kidney-function endpoints (and the 104-week A1C <=6.5% and >=10% weight-reduction responder endpoints).'
  source: web:eli-lilly-an-2026-09-30-lilly-s-oral-glp-1-foundayo-orforglipron
  quote: All-cause death, waist circumference, serum lipids, blood pressure, hsCRP, cardiovascular death and kidney function endpoints were not controlled for family-wise type 1 error.
- key: note:orforglipron:F438
  topic: Q6_ACHIEVE_4_CARDIOVASCULAR_ANALYSIS
  statement: 'Topline release wording on all-cause death: ''While not controlled for multiplicity, the risk of all-cause death was significantly lower for Foundayo vs. insulin glargine.'''
  source: web:eli-lilly-an-2026-04-16-achieve-4-the-longest-phase-3-study-of-l
  quote: While not controlled for multiplicity, the risk of all-cause death was significantly lower for Foundayo vs. insulin glargine.
- key: note:orforglipron:F439
  topic: Q6_ACHIEVE_4_CARDIOVASCULAR_ANALYSIS
  statement: 'Superiority: no source retrieved claims superiority of orforglipron over insulin glargine for MACE-4 or MACE-3. The Lancet abstract concludes that cardiovascular safety was confirmed by demonstrating
    non-inferiority for MACE-4; the release frames the result as meeting the primary objective for non-inferiority.'
  source: pubmed:42815506
  quote: was confirmed by demonstrating non-inferiority to insulin glargine for MACE-4
- key: note:orforglipron:F446
  topic: Q6_ACHIEVE_4_GLYCAEMIC_AND_WEIGHT_RESULT
  statement: Lilly Medical Information describes the ACHIEVE-4 HbA1c and body-weight analyses through week 104 as exploratory, descriptive and not controlled for type I error.
  source: web:eli-lilly-an-undated-lilly-medical-information-response-what
  quote: these efficacy outcomes were descriptive and not controlled for type I error
