claims:
- key: note:retatrutide-tirzepatide:F7
  topic: Q1_RETATRUTIDE_MECHANISM_AND_REGULATORY
  statement: 'Most recent sponsor statement found (2026-09-29): BLA submission to FDA still planned for Q1 2027, i.e. not yet submitted.'
  source: web:eli-lilly-an-2026-09-29-lilly-s-triple-agonist-retatrutide-deliv
  quote: Lilly plans to submit a Biologics License Application (BLA) in Q1 2027 to the U.S. Food and Drug Administration.
- key: note:retatrutide-tirzepatide:F68
  topic: Q3_RETATRUTIDE_PHASE_3_TRIUMPH_TRANSCEND
  statement: 'Peer-reviewed publication of TRIUMPH-2: Lancet 2026;408(10563):1455-1472, online 2026-09-29, PMID 42810372; 1152 randomized 1:1:1:1 (4 mg n=292, 9 mg n=284, 12 mg n=287, placebo n=289); primary
    = % change in bodyweight to week 80 for 9 mg and 12 mg vs placebo; 4 mg vs placebo key secondary; treatment regimen estimand.'
  source: pubmed:42810372
  quote: with missing data imputed with a primary multiple imputation strategy for the treatment regimen estimand
- key: note:retatrutide-tirzepatide:F84
  topic: Q3_RETATRUTIDE_PHASE_3_TRIUMPH_TRANSCEND
  statement: 'TRIUMPH-2 (Lancet): permanent treatment discontinuation due to adverse events or death: retatrutide 9 mg 33 (12%), 12 mg 22 (8%), 4 mg 11 (4%), placebo 14 (5%).'
  source: pubmed:42810372
  quote: treatment discontinuation due to adverse events or death was more frequent in participants treated with retatrutide 9 mg (33 [12%]) and 12 mg (22 [8%])
- key: note:retatrutide-tirzepatide:F85
  topic: Q3_RETATRUTIDE_PHASE_3_TRIUMPH_TRANSCEND
  statement: 'TRIUMPH-2 (Lancet): dysesthesia incidence 13 (4%), 16 (6%), 21 (7%) with retatrutide 4/9/12 mg vs 2 (1%) placebo; hypotension 4 (1%), 14 (5%), 18 (6%) vs 1 (<1%).'
  source: pubmed:42810372
  quote: 13 [4%], 16 [6%], and 21 [7%] vs two [1%] in the placebo group with dysesthesia
- key: note:retatrutide-tirzepatide:F86
  topic: Q3_RETATRUTIDE_PHASE_3_TRIUMPH_TRANSCEND
  statement: 'TRIUMPH-2: proportion reaching A1C <5.7% (28.4%, 40.0%, 39.3% vs 4.4%; efficacy estimand) was flagged as not controlled for family-wise type 1 error.'
  source: web:eli-lilly-an-2026-09-29-lilly-s-triple-agonist-retatrutide-deliv
  quote: Not controlled for family-wise type 1 error.
- key: note:retatrutide-tirzepatide:F87
  topic: Q3_RETATRUTIDE_PHASE_3_TRIUMPH_TRANSCEND
  statement: TRIUMPH-2 detailed results were presented at EASD 2026 and simultaneously published in The Lancet.
  source: web:eli-lilly-an-2026-09-29-lilly-s-triple-agonist-retatrutide-deliv
  quote: presented at the 62nd Annual Meeting of the European Association for the Study of Diabetes (EASD) in Milan, Italy, and simultaneously published in The Lancet
