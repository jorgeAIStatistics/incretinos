claims:
- key: note:eloralintide-pipeline:F3
  topic: Q1_ELORALINTIDE_MECHANISM_STATUS_PHASE_2
  statement: The Lancet abstract describes eloralintide as a novel, selective amylin receptor agonist in development for weight management.
  source: pubmed:41207310
  quote: Eloralintide is a novel, selective amylin receptor agonist in development for weight management.
- key: note:eloralintide-pipeline:F9
  topic: Q1_ELORALINTIDE_MECHANISM_STATUS_PHASE_2
  statement: 'Publication of the Phase 2 monotherapy trial: Billings LK et al., Lancet 2025;406(10520):2631-2643, PMID 41207310, DOI 10.1016/S0140-6736(25)02155-5.'
  source: pubmed:41207310
  quote: This study was completed on Aug 14, 2025, and is registered with ClinicalTrials.gov (NCT06230523).
- key: note:eloralintide-pipeline:F10
  topic: Q1_ELORALINTIDE_MECHANISM_STATUS_PHASE_2
  statement: 'Design: phase 2, double-blind, randomised, placebo-controlled; 263 participants from 46 US research centres; randomised 2:1:1:1:2:1:2 to placebo or eloralintide 1 mg, 3 mg, 6 mg, 9 mg, or
    dose escalations 6-9 mg or 3-9 mg, once weekly subcutaneously for 48 weeks.'
  source: pubmed:41207310
  quote: randomly assigned (2:1:1:1:2:1:2) to receive once-per-week subcutaneous injections of placebo or eloralintide at 1 mg, 3 mg, 6 mg, or 9 mg
- key: note:eloralintide-pipeline:F11
  topic: Q1_ELORALINTIDE_MECHANISM_STATUS_PHASE_2
  statement: 'Population: adults aged 18-75 years with BMI >=30 kg/m2, or BMI >=27 kg/m2 with at least one weight-related comorbidity, without type 2 diabetes.'
  source: pubmed:41207310
  quote: a BMI of 27 kg/m2 or higher with at least one weight-related comorbidity and without type 2 diabetes
- key: note:eloralintide-pipeline:F12
  topic: Q1_ELORALINTIDE_MECHANISM_STATUS_PHASE_2
  statement: 'Baseline (all randomised): mean bodyweight 109.1 kg, BMI 39.1 kg/m2, 204 (78%) female, 205 (78%) White.'
  source: pubmed:41207310
  quote: mean bodyweight 109·1 kg [22·8], BMI 39·1 kg/m2 [6·8], 204 [78%] female, and 205 [78%] White
- key: note:eloralintide-pipeline:F13
  topic: Q1_ELORALINTIDE_MECHANISM_STATUS_PHASE_2
  statement: 'Primary endpoint: percent change in bodyweight from baseline after 48 weeks of treatment; efficacy analyses included all randomly assigned participants.'
  source: pubmed:41207310
  quote: The primary endpoint was percent change in bodyweight from baseline after 48 weeks of treatment.
- key: note:eloralintide-pipeline:F15
  topic: Q1_ELORALINTIDE_MECHANISM_STATUS_PHASE_2
  statement: 'Estimand definition used by Lilly for headline numbers: efficacy estimand.'
  source: web:lilly-pr-2025-11-06-eloralintide-ph2
  quote: The efficacy estimand represents efficacy had all randomized participants remained on study intervention (with possible dose interruptions and/or dose modifications) for 48 weeks.
- key: note:eloralintide-pipeline:F101
  topic: Q1_ELORALINTIDE_MECHANISM_STATUS_PHASE_2
  statement: 'Lilly''s summary of tolerability: most common adverse events were mild to moderate gastrointestinal symptoms and fatigue, more frequent in higher-dose arms; lower with slower dose escalation
    and similar to placebo for 1 mg and 3 mg.'
  source: web:lilly-pr-2025-11-06-eloralintide-ph2
  quote: The most common adverse events were mild to moderate gastrointestinal symptoms and fatigue, which were seen more frequently in the higher dose arms.
- key: note:eloralintide-pipeline:F102
  topic: Q1_ELORALINTIDE_MECHANISM_STATUS_PHASE_2
  statement: Cardiometabolic risk-factor findings (waist circumference, blood pressure, lipid profiles, glycemic control, markers of inflammation) are reported by Lilly as associations; the release does
    not use the word 'exploratory', and these measures are not among the primary/secondary outcomes registered on ClinicalTrials.gov for NCT06230523.
  source: web:lilly-pr-2025-11-06-eloralintide-ph2
  quote: Treatment with eloralintide was also associated with improvements across cardiometabolic risk factors including waist circumference, blood pressure, lipid profiles, glycemic control and markers
    of inflammation.
