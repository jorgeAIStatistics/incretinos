claims:
- key: note:orforglipron:F59
  topic: Q2_FORMULATION_HARMONIZATION_CAPSULE_VS
  statement: Lilly Medical Information states ATTAIN-1 was conducted with an investigational capsule formulation (1, 3, 6, 12, 24, 36 mg) and presents data as equivalent doses of the approved tablets (0.8,
    2.5, 5.5, 9, 14.5, 17.2 mg).
  source: web:eli-lilly-an-2026-04-01-lilly-medical-information-response-in-at
  quote: shown as equivalent doses of once daily orforglipron tablets (0.8 mg, 2.5 mg, 5.5 mg, 9 mg, 14.5 mg, and 17.2 mg)
- key: note:orforglipron:F60
  topic: Q3_ATTAIN_1_PUBLICATION
  statement: 'ATTAIN-1 primary publication: Wharton S, et al. N Engl J Med 2025;393(18):1796-1806; PMID 40960239; DOI 10.1056/NEJMoa2511774; published online 2025-09-16, print issue 2025-11-06.'
  source: pubmed:40960239
  quote: ATTAIN-1 ClinicalTrials.gov number, NCT05869903
- key: note:orforglipron:F62
  topic: Q3_ATTAIN_1_DESIGN
  statement: ATTAIN-1 was a phase 3, multinational, randomized, double-blind trial of once-daily orforglipron 6 mg, 12 mg or 36 mg versus placebo (3:3:3:4) for 72 weeks as an adjunct to healthy diet and
    physical activity, in patients with obesity without diabetes.
  source: pubmed:40960239
  quote: at doses of 6 mg, 12 mg, or 36 mg, as compared with placebo (assigned in a 3:3:3:4 ratio)
- key: note:orforglipron:F63
  topic: Q3_ATTAIN_1_DESIGN
  statement: 'ATTAIN-1 primary endpoint: percent change in body weight from baseline to week 72, assessed according to the treatment-regimen estimand in the intention-to-treat population.'
  source: pubmed:40960239
  quote: as assessed according to the treatment-regimen estimand in the intention-to-treat population
- key: note:orforglipron:F64
  topic: Q3_ATTAIN_1_DESIGN
  statement: 'FDA review: in ATTAIN-1 the treatment-regimen estimand was primary and the efficacy estimand supportive; primary and key secondary objectives used a graphical multiple-testing procedure controlling
    family-wise type I error at two-sided alpha 0.05 within each estimand.'
  source: web:u-s-fda-ce-2026-05-15-nda-220934-foundayo-orforglipron-nda-mul
  quote: The treatment regimen estimand was primary, with efficacy estimand supportive; no further adjustments were made for other analyses.
- key: note:orforglipron:F146
  topic: Q3_ATTAIN_1_CATEGORICAL_WEIGHT_LOSS
  statement: 'ATTAIN-1 NEJM abstract (treatment-regimen estimand): in the 36 mg group 54.6% had >=10%, 36.0% had >=15% and 18.4% had >=20% weight reduction, versus 12.9%, 5.9% and 2.8% with placebo.'
  source: pubmed:40960239
  quote: 54.6% had a reduction of 10% or more, 36.0% had a reduction of 15% or more, and 18.4% had a reduction of 20% or more
- key: note:orforglipron:F147
  topic: Q3_ATTAIN_1_SAFETY
  statement: 'ATTAIN-1 NEJM abstract: adverse events led to treatment discontinuation in 5.3 to 10.3% of patients in the orforglipron groups and 2.7% in the placebo group (range across orforglipron arms;
    per-arm values not in the abstract).'
  source: pubmed:40960239
  quote: treatment discontinuation in 5.3 to 10.3% of the patients in the orforglipron groups and in 2.7% of those in the placebo group
