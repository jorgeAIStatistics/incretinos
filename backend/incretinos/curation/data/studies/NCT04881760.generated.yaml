claims:
- key: note:retatrutide-tirzepatide:F2
  topic: Q1_RETATRUTIDE_MECHANISM_AND_REGULATORY
  statement: Phase 2 NEJM paper describes retatrutide (LY3437943) as an agonist of the GIP, GLP-1 and glucagon receptors.
  source: pubmed:37366315
  quote: Retatrutide (LY3437943) is an agonist of the glucose-dependent insulinotropic polypeptide, glucagon-like peptide 1, and glucagon receptors.
- key: note:retatrutide-tirzepatide:F13
  topic: Q2_RETATRUTIDE_PHASE_2_OBESITY_TRIAL_NEJ
  statement: Phase 2, double-blind, randomized, placebo-controlled trial in adults with BMI >=30 or 27 to <30 plus a weight-related condition; 338 enrolled; 48 weeks; PMID 37366315, DOI 10.1056/NEJMoa2301972.
  source: pubmed:37366315
  quote: We enrolled 338 adults, 51.8% of whom were men.
- key: note:retatrutide-tirzepatide:F14
  topic: Q2_RETATRUTIDE_PHASE_2_OBESITY_TRIAL_NEJ
  statement: Primary end point was percentage change in body weight from baseline to 24 weeks; 48-week change was secondary.
  source: pubmed:37366315
  quote: The primary end point was the percentage change in body weight from baseline to 24 weeks.
- key: note:retatrutide-tirzepatide:F29
  topic: Q2_RETATRUTIDE_PHASE_2_OBESITY_TRIAL_NEJ
  statement: 'Safety note: dose-dependent heart-rate increases peaked at 24 weeks and declined thereafter; most common adverse events were gastrointestinal.'
  source: pubmed:37366315
  quote: Dose-dependent increases in heart rate peaked at 24 weeks and declined thereafter.
