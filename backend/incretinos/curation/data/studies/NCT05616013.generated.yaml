claims:
- key: note:eloralintide-pipeline:F160
  topic: Q5_BIMAGRUMAB
  statement: The BELIEVE publication describes bimagrumab as a fully human recombinant monoclonal antibody targeting activin type II receptors (ActRIIA and ActRIIB), preventing binding of natural ligands.
  source: pubmed:41772149
  quote: Bimagrumab is a fully human, recombinant monoclonal antibody that targets activin type II receptors (ActRIIA and ActRIIB), preventing binding of natural ligands.
- key: note:eloralintide-pipeline:F161
  topic: Q5_BIMAGRUMAB
  statement: 'BELIEVE publication: Heymsfield SB et al., Nat Med 2026;32(3):869-882, PMID 41772149, DOI 10.1038/s41591-026-04204-0. Phase 2, double-blind (bimagrumab) with open-label semaglutide, placebo-controlled;
    507 adults with obesity (BMI >=30, or >=27 with a complication, excluding diabetes) randomized 1:1:1:1:1:1:1:1:1 to nine groups for 48 weeks, with open-label extension to week 72; 26 sites in the United
    States, Australia and New Zealand.'
  source: pubmed:41772149
  quote: were randomized to nine groups (1:1:1:1:1:1:1:1:1 ratio) to receive treatment for 48 weeks
- key: note:eloralintide-pipeline:F162
  topic: Q5_BIMAGRUMAB
  statement: 'BELIEVE primary endpoint: absolute change from baseline in body weight (kg) at week 48. No multiplicity adjustment; p-values are nominal; week 72 analyses were post hoc.'
  source: pubmed:41772149
  quote: No multiplicity adjustments were made; therefore, these results should not be used to infer definitive treatment effects.
- key: note:eloralintide-pipeline:F167
  topic: Q5_BIMAGRUMAB
  statement: 'BELIEVE: high-dose combination vs semaglutide 2.4 mg, LSM change in body weight at week 48 was -17.8 kg vs -14.2 kg (treatment regimen estimand; nominal P < 0.05).'
  source: pubmed:41772149
  quote: greater with the high-dose combination versus semaglutide 2.4 mg (−17.8 kg versus −14.2 kg; < 0.05)
- key: note:eloralintide-pipeline:F171
  topic: Q5_BIMAGRUMAB
  statement: 'Body-composition method in BELIEVE: dual-energy X-ray absorptiometry (DXA) - total body fat mass, total body lean mass, appendicular lean mass and estimated visceral adipose tissue. MRI was
    not used; muscle was measured only as part of DXA lean mass.'
  source: pubmed:41772149
  quote: our study used DXA, where muscle mass was measured as part of lean mass
- key: note:eloralintide-pipeline:F182
  topic: Q5_BIMAGRUMAB
  statement: 'BELIEVE exploratory endpoints (as designated by the authors): total and regional bone mineral density, lipid profile, hsCRP, grip strength, fasting insulin, free testosterone, adipokines,
    total caloric intake and protein intake.'
  source: pubmed:41772149
  quote: Exploratory endpoints included here are total and regional BMD, lipid profile, hsCRP, grip strength, fasting insulin and free testosterone levels at weeks 48 and 72
