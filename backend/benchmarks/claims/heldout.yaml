    sentence: "At 72 weeks in SURMOUNT-1, body weight fell by 19.5% with tirzepatide 10 mg [C1] and by 3.1% with placebo [C2]."
    expected_fact: 1
    note: "Two facts, each magnitude next to its own marker; direction given in words ('fell by') instead of a sign."
