# Held-out adversarial benchmark for the summary claim verifier.
# Written independently of the verifier and of benchmarks/ (neither was read).
# Every selector was resolved against the seeded database (backend/var/incretinos.db):
#   result      -> first matching arm-level OutcomeResult of the study in primary-key order
#   analysis    -> exactly one matching StatisticalAnalysis
#   claim       -> evidence_claim.key
#   drug_status -> drug.slug
# VALID sentences use the stored numbers; each REJECT case changes one thing, named in its note.
version: 1
cases:
  - id: ho-val-001
    category: VALID
    expected: SUPPORTED
    evidence:
      - kind: result
        nct: NCT04184622
        arm_contains: "15 mg"
        category: WEIGHT_PCT_CHANGE
        estimand: TREATMENT_REGIMEN
        tier: PEER_REVIEWED
        weeks: 72
    sentence: "In SURMOUNT-1, mean body weight changed by −20.9% (95% CI, −21.8 to −19.9) at week 72 with tirzepatide 15 mg under the treatment-regimen estimand [C1]."
    expected_fact: 1
    note: "Faithful: value, interval, week, arm and estimand as stored; unicode minus and 'CI, a to b' punctuation."
