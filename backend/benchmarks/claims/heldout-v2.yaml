# IncretinOS claim-verifier held-out adversarial benchmark, version 2.
# Written blind against the seeded evidence database; every selector was resolved and every VALID
# number checked against stored values. Selector keys: result(nct, arm_contains, category, estimand?, tier?, weeks?),
# analysis(nct, category, treatment_contains, comparator_contains, estimand?, tier?, weeks?, hypothesis_type?),
# claim(key = evidence_claim.key), drug_status(slug = drug.slug).
