  # =========================================================================== DRUG_SWAPPED
  - id: audit-W03a
    category: DRUG_SWAPPED
    expected: REJECT
    evidence: [*t1_reta12]
    sentence: "In TRIUMPH-1, the tirzepatide 12 mg group had a percent change in body weight of -25% at week 80 [C1]."
    note: "Audit W03 (first sentence): drug name swapped; all numbers are in the card."
  - id: audit-W03b
    category: DRUG_SWAPPED
