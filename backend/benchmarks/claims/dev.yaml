cases:
  # =========================================================================== VALID
  - id: audit-F01a
    category: VALID
    expected: SUPPORTED
    evidence: [*t1_reta12]
    sentence: "In TRIUMPH-1, adults without type 2 diabetes in the retatrutide 12 mg group had a reported percent change in body weight of -25% from baseline at week 80 under the treatment-regimen estimand, with no confidence interval reported [C1]."
    expected_fact: 1
    note: "Audit F01, first sentence: close paraphrase of the card."
  - id: audit-F01b
    category: VALID
    expected: SUPPORTED
    evidence: [*s1_tzp15]
    sentence: "In SURMOUNT-1, the tirzepatide 15 mg group had -20.9% at week 72 under the treatment-regimen estimand (95% CI -21.8 to -19.9) [C1]."
    expected_fact: 1
    note: "Audit F01, second sentence."
  - id: audit-F02a
    category: VALID
    expected: SUPPORTED
    evidence: [*an_ac4_mace4]
    sentence: "In ACHIEVE-4, the hazard ratio for MACE-4 with orforglipron versus insulin glargine was 0.84 (95% CI 0.59 to 1.2), with p <0.0001 for non-inferiority [C1]."
    expected_fact: 1
    note: "Audit F02, first sentence."
  - id: audit-F04
    category: VALID
    expected: SUPPORTED
    evidence: [*t1_reta12]
    sentence: "In TRIUMPH-1, the retatrutide 12 mg group had a reported percent change in body weight of -25.0% at week 80 [C1]."
    expected_fact: 1
    note: "Audit F04: trailing zero; -25.0 equals -25."
  - id: audit-F06
    category: VALID
    expected: SUPPORTED
    evidence: [*t1_reta12]
    sentence: "In TRIUMPH-1, the retatrutide 12 mg group had a reported percent change in body weight of -25% at week 80. [C1]"
    expected_fact: 1
    note: "Audit F06: citation marker placed after the full stop."
  - id: valid-unicode-minus-ci-comma
    category: VALID
    expected: SUPPORTED
    evidence: [*s1_tzp15]
    sentence: "In SURMOUNT-1, body weight changed by −20.9% (95% CI, −21.8 to −19.9) with tirzepatide 15 mg at 72 weeks [C1]."
    expected_fact: 1
    note: "Unicode minus, comma after CI, 'at 72 weeks'."
  - id: valid-fell-by
    category: VALID
    expected: SUPPORTED
    evidence: [*s1_tzp15]
    sentence: "Body weight fell by 20.9% with tirzepatide 15 mg at week 72 in SURMOUNT-1 [C1]."
    expected_fact: 1
    note: "Direction carried by the verb; unsigned magnitude."
  - id: valid-passive-reduction
    category: VALID
    expected: SUPPORTED
    evidence: [*s1_tzp15]
    sentence: "A mean weight reduction of 20.9% was observed with tirzepatide 15 mg in SURMOUNT-1 after 72 weeks of treatment [C1]."
    expected_fact: 1
    note: "Passive voice; 'after 72 weeks'."
  - id: valid-en-dash-interval
    category: VALID
    expected: SUPPORTED
    evidence: [*s1_tzp15]
    sentence: "Tirzepatide 15 mg: –20.9% (95% CI –21.8 – –19.9) at week 72 in SURMOUNT-1 [C1]."
    expected_fact: 1
    note: "En dashes as minus signs and as the range separator."
  - id: valid-two-arms-versus
    category: VALID
    expected: SUPPORTED
    evidence: [*s1_tzp15, *s1_placebo]
    sentence: "In SURMOUNT-1, tirzepatide 15 mg lost 20.9% of body weight versus 3.1% with placebo at week 72 [C1][C2]."
    expected_fact: 1
    note: "Two arm-level values side by side; each (arm, value) pair binds to its own fact."
  - id: valid-list-respectively
    category: VALID
    expected: SUPPORTED
    evidence: [*s1_tzp5, *s1_tzp10, *s1_tzp15]
    sentence: "In SURMOUNT-1, tirzepatide 5 mg, 10 mg and 15 mg produced weight changes of -15.0%, -19.5% and -20.9%, respectively, at week 72 [C1][C2][C3]."
    expected_fact: 3
    note: "Three doses and three values paired by position."
  - id: valid-two-trials-side-by-side
    category: VALID
    expected: SUPPORTED
    evidence: [*t1_reta12, *s1_tzp15]
    sentence: "Retatrutide 12 mg produced -25% at week 80 in TRIUMPH-1 and tirzepatide 15 mg produced -20.9% at week 72 in SURMOUNT-1 [C1][C2]."
    expected_fact: 1
    note: "Side-by-side description of two trials with no comparative claim."
  - id: valid-analysis-difference
    category: VALID
    expected: SUPPORTED
    evidence: [*an_s1_tzp15_label]
    sentence: "In SURMOUNT-1, the estimated treatment difference between tirzepatide 15 mg and placebo in percent change in body weight was -17.8 percentage points (95% CI -19.3 to -16.3; p<0.001) at week 72 [C1]."
    expected_fact: 1
    note: "Between-arm difference with its interval and p-value."
  - id: valid-analysis-more-than-placebo
    category: VALID
    expected: SUPPORTED
    evidence: [*an_s1_tzp15_label]
    sentence: "Tirzepatide 15 mg reduced body weight by 17.8 percentage points more than placebo in SURMOUNT-1 (95% CI -19.3 to -16.3) [C1]."
    expected_fact: 1
    note: "Comparative wording bound to one between-arm analysis whose interval excludes no difference."
  - id: valid-rewind-superiority-test
    category: VALID
    expected: SUPPORTED
    evidence: [*an_rewind_label]
    sentence: "In REWIND, the hazard ratio for MACE-3 with dulaglutide 1.5 mg versus placebo was 0.88 (95% CI 0.79 to 0.99; p 0.026) in a superiority test [C1]."
    expected_fact: 1
    note: "The stored hypothesis type is SUPERIORITY and the interval excludes 1."
  - id: valid-rewind-significant
    category: VALID
    expected: SUPPORTED
    evidence: [*an_rewind_label]
    sentence: "Dulaglutide 1.5 mg significantly lowered the hazard of MACE-3 relative to placebo in REWIND (hazard ratio 0.88; 95% CI 0.79 to 0.99; p 0.026) [C1]."
    expected_fact: 1
    note: "Significance is on record: superiority test, p 0.026, multiplicity controlled."
  - id: valid-cvot-noninferiority-test
    category: VALID
    expected: SUPPORTED
    evidence: [*an_cvot_mace]
    sentence: "In SURPASS-CVOT, the hazard ratio for MACE-3 with tirzepatide versus dulaglutide 1.5 mg was 0.92 (95.3% CI 0.83 to 1.01), tested for non-inferiority [C1]."
    expected_fact: 1
    note: "Names the hypothesis without claiming it was met; 95.3% interval."
  - id: valid-ni-margin-met
    category: VALID
    expected: SUPPORTED
    evidence: [*an_ac4_mace4]
    sentence: "In ACHIEVE-4, orforglipron met the non-inferiority margin of 1.8 for MACE-4 versus insulin glargine (hazard ratio 0.84; 95% CI 0.59 to 1.2) [C1]."
    expected_fact: 1
    note: "Non-inferiority met is stored (margin 1.8, met YES)."
  - id: valid-not-significant
    category: VALID
    expected: SUPPORTED
    evidence: [*an_ac4_mace3]
    sentence: "In ACHIEVE-4, the press-release hazard ratio for MACE-3 with orforglipron versus insulin glargine was 0.77 (95% CI 0.52 to 1.13; p 0.181), which was not statistically significant [C1]."
    expected_fact: 1
    note: "Tier named correctly; the interval includes 1 and p is 0.181."
  - id: valid-hba1c-points
    category: VALID
    expected: SUPPORTED
    evidence: [*ac3_orfo12_hba1c]
    sentence: "In ACHIEVE-3, HbA1c decreased by 1.71 percentage points with orforglipron 12 mg at week 52 (treatment-regimen estimand; n = 424) [C1]."
    expected_fact: 1
    note: "HbA1c change expressed in percentage points."
  - id: valid-hba1c-percent-t2d
    category: VALID
    expected: SUPPORTED
    evidence: [*ac3_orfo12_hba1c]
    sentence: "Orforglipron 12 mg lowered HbA1c by 1.71% at 52 weeks in adults with type 2 diabetes in ACHIEVE-3 [C1]."
    expected_fact: 1
    note: "Population named correctly."
  - id: valid-kilograms
    category: VALID
    expected: SUPPORTED
    evidence: [*sp2_tzp15_kg]
    sentence: "In SURPASS-2, tirzepatide 15 mg reduced body weight by 12.4 kg at week 40 (n = 464) [C1]."
    expected_fact: 1
    note: "Absolute change in kilograms from a registry row."
  - id: valid-responder
    category: VALID
    expected: SUPPORTED
    evidence: [*s1_tzp15_responder]
    sentence: "In SURMOUNT-1, 96.32% of participants receiving tirzepatide 15 mg achieved at least 5% body weight reduction at week 72 [C1]."
    expected_fact: 1
    note: "Responder proportion with its threshold."
  - id: valid-mace-proportion
    category: VALID
    expected: SUPPORTED
    evidence: [*ac4_orfo_mace]
    sentence: "In ACHIEVE-4, 4.2% of participants in the orforglipron group had a MACE-4 event (n = 1358) [C1]."
    expected_fact: 1
    note: "Event proportion; no time point is stored and none is asserted."
  - id: valid-weight-regain
    category: VALID
    expected: SUPPORTED
    evidence: [*s4_placebo_switched]
    sentence: "After switching to placebo in SURMOUNT-4, body weight increased by 14.0% from randomization at week 36 to week 88 [C1]."
    expected_fact: 1
    note: "A positive change; the baseline week is named together with the assessment week."
  - id: valid-registry-efficacy-inferred
    category: VALID
    expected: SUPPORTED
    evidence: [*s1_tzp15_registry]
    sentence: "In SURMOUNT-1, the registry-posted result for tirzepatide 15 mg under the efficacy estimand was -22.5% at week 72 (n = 625), with the estimand inferred from the analysis description [C1]."
    expected_fact: 1
    note: "Tier, estimand and estimand basis all as stored."
  - id: valid-press-release-not-peer-reviewed
    category: VALID
    expected: SUPPORTED
    evidence: [*t1_reta12_efficacy]
    sentence: "A sponsor press release reported a -28.3% change in body weight with retatrutide 12 mg at week 80 in TRIUMPH-1 under the efficacy estimand; this topline figure is not peer reviewed [C1]."
    expected_fact: 1
    note: "States the tier and its limit."
  - id: valid-label-foundayo
    category: VALID
    expected: SUPPORTED
    evidence: [*a1_foundayo172]
    sentence: "The FDA prescribing information reports a -11.1% change in body weight at week 72 for FOUNDAYO 17.2 mg in ATTAIN-1 [C1]."
    expected_fact: 1
    note: "Brand name resolves to the drug; label tier."
  - id: valid-attain1-ci-n
    category: VALID
    expected: SUPPORTED
    evidence: [*a1_orfo36]
    sentence: "Orforglipron 36 mg was associated with a −11.2% change in body weight at week 72 in ATTAIN-1 (95% CI −12.0 to −10.4; n = 730) [C1]."
    expected_fact: 1
    note: "Interval and n of the same arm."
  - id: valid-t2d-population
    category: VALID
    expected: SUPPORTED
    evidence: [*t2_reta12]
    sentence: "In TRIUMPH-2, adults with type 2 diabetes receiving retatrutide 12 mg had a -18.8% change in body weight at week 80 (n = 287) [C1]."
    expected_fact: 1
    note: "Population as stored."
  - id: valid-phase2-dose-group
    category: VALID
    expected: SUPPORTED
    evidence: [*el2_elora9]
    sentence: "In the Phase 2 eloralintide trial, the 9 mg group had a body-weight change of -20.0% at week 48 under the efficacy estimand (95% CI -22.7 to -17.5; n = 54) [C1]."
    expected_fact: 1
    note: "Dose named apart from the drug."
  - id: valid-surmount5-two-arms
    category: VALID
    expected: SUPPORTED
    evidence: [*s5_tzp, *s5_sema]
    sentence: "In SURMOUNT-5, the percent change in body weight at week 72 was -20.2% with tirzepatide (95% CI -21.4 to -19.1) and -13.7% with semaglutide (95% CI -14.9 to -12.6) [C1][C2]."
    expected_fact: 1
    note: "Two arms, each with its own interval."
  - id: valid-cvot-death-not-controlled
    category: VALID
    expected: SUPPORTED
    evidence: [*an_cvot_death]
    sentence: "In SURPASS-CVOT, the hazard ratio for all-cause death with tirzepatide versus dulaglutide 1.5 mg was 0.84 (95% CI 0.75 to 0.94); this analysis was not controlled for multiplicity and no p-value is reported [C1]."
    expected_fact: 1
    note: "Reports the estimate with its limits on interpretation."
  - id: valid-exploratory-labelled
    category: VALID
    expected: SUPPORTED
    evidence: [*an_ac4_death]
    sentence: "In ACHIEVE-4, the exploratory hazard ratio for all-cause death with orforglipron versus insulin glargine was 0.43 (95% CI 0.25 to 0.75), with a nominal p-value of 0.002 that was not controlled for multiplicity [C1]."
    expected_fact: 1
    note: "Exploratory result described as exploratory and nominal."
  - id: valid-combination-arm
    category: VALID
    expected: SUPPORTED
    evidence: [*eltzp_combo]
    sentence: "In the EloraTZP Phase 2b trial, eloralintide 9 mg plus tirzepatide 15 mg produced a -23.3% change in body weight at week 48 under the efficacy estimand, according to a sponsor press release [C1]."
    expected_fact: 1
    note: "Combination arm with both components and doses."
  - id: valid-drug-status-investigational
    category: VALID
    expected: SUPPORTED
    evidence: [*ds_retatrutide]
    sentence: "Retatrutide is an investigational triple GIP, GLP-1 and glucagon receptor agonist and is not approved for any indication [C1]."
    expected_fact: 1
    note: "Regulatory status and pharmacologic class as stored."
  - id: valid-drug-status-approved
    category: VALID
    expected: SUPPORTED
    evidence: [*ds_tirzepatide]
    sentence: "Tirzepatide is FDA-approved as Zepbound for chronic weight management [C1]."
    expected_fact: 1
    note: "Approved status and one of the labelled uses."
  - id: valid-claim-believe-design
    category: VALID
    expected: SUPPORTED
    evidence: [*cl_believe_design]
    sentence: "The BELIEVE primary endpoint was the absolute change from baseline in body weight at week 48, with no multiplicity adjustment [C1]."
    expected_fact: 1
    note: "Paraphrase of a curated design claim."
  - id: valid-claim-phase1
    category: VALID
    expected: SUPPORTED
    evidence: [*cl_eloratzp_phase1]
    sentence: "According to Lilly, adding eloralintide 3 mg to tirzepatide 5 mg led to 17% weight loss over 16 weeks in a Phase 1 study [C1]."
