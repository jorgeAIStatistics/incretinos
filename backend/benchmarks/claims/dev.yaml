# Development benchmark for the claim verifier (incretinos benchmark-claims --set dev).
#
# Every case cites stored evidence by its scientific description and gives one sentence a model might draft.
# expected: SUPPORTED means a faithful verifier must accept the sentence; REJECT means it must refuse it.
# Cases whose id starts with "audit-" are the drafts of the Session 2 audit (assistant.json B2/B3, security.json F02),
# kept verbatim. The evidence library below only saves repetition: YAML aliases expand to the plain case format.
#
# This set is used while developing the verifier. It is not a measure of generalisation; the held-out set is.
#
# Three cases written against the pre-repair data were moved, unchanged, to invalidated.yaml when the stored record
# they describe was removed or its endpoint role was corrected (see that file for the reason of each).
version: 1

evidence_library:
