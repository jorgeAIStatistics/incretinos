    note: "Paraphrase of a curated press-release claim."
  - id: valid-claim-attain1-primary
    category: VALID
    expected: SUPPORTED
    evidence: [*cl_attain1_primary]
    sentence: "The ATTAIN-1 primary endpoint was the percent change in body weight from baseline to week 72, assessed under the treatment-regimen estimand [C1]."
    expected_fact: 1
