[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incretinos"
version = "0.1.0"
description = "IncretinOS — clinical evidence and trial intelligence for incretin/amylin therapeutics (public data only)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.1",
  "statsmodels>=0.14",
  "pyyaml>=6.0",
  "defusedxml>=0.7",
  "apscheduler>=3.10",
  "typer>=0.12",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]
llm = ["anthropic>=0.40"]

[project.scripts]
incretinos = "incretinos.cli:app"

[tool.setuptools.packages.find]
include = ["incretinos*"]

[tool.setuptools.package-data]
incretinos = ["curation/data/**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["live: hits real public APIs (deselected by default)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
